# run and test --target: programs of other targets this machine starts itself, Rosetta and static musl, the others through runner.<target>
steps = [
    { command = "run --target macos-x86_64", output = "hello from x86_64", platforms = ["macos"] },
    { command = "test --target macos-x86_64", output = "tests on x86_64", platforms = ["macos"] },
    { command = "run --target linux-x86_64-musl", output = "hello from x86_64", platforms = ["linux"] },
    { command = "test --target linux-x86_64-musl", output = "tests on x86_64", platforms = ["linux"] },
    { command = "run --target linux-aarch64", fails = true, output = "a runner starts them: xkit config runner.linux-aarch64 <command>", platforms = ["macos", "windows"] },
    { command = "config runner.linux-aarch64 'echo runner for'", platforms = ["macos", "linux"] },
    { command = "config runner.linux-aarch64 'cmd /c echo runner for'", platforms = ["windows"] },
    { command = "run --target linux-aarch64 -- one", output = "runner for" },
    { command = "test --target linux-aarch64", output = "runner for" },
    "config --unset runner.linux-aarch64",
    { command = "run --target linux-aarch64 --target windows-x86_64", fails = true, output = "run and test take one --target" },
]
