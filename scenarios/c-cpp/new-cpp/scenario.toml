# new and add of C++, install of vcpkg ports
steps = [
    "new cpp hello",
    "add cpp-library greet hello/project.build",
    "install doctest --test --module greet hello/project.build",
    "install fmt --module hello hello/project.build",
    "build hello/project.build",
    "build again hello/project.build",
    "test hello/project.build",
    "run hello/project.build",
]
