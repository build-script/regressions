# build new go and build add go with the templates of the official plugin: no go.mod, build-script writes src/go.mod
steps = [
    { command = "new go hello", absent = ["hello/go.mod", "hello/src/go.mod"], files = ["hello/.gitignore"] },
    { command = "run hello/project.build", output = "Hello from hello", files = ["hello/src/go.mod"] },
    "test hello/project.build",
    "new workspace tools",
    "add go api tools/project.build",
    { command = "run tools/project.build", output = "Hello from api", files = ["tools/api/src/go.mod"] },
    "build again tools/project.build",
]
