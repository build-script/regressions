# The scenarios against build-script/build: on Linux and Windows all of them, macOS only when asked for,
# its minutes count ten times.
name: regressions

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag of build-script/build
        default: main
      kinds:
        description: Kinds of scenarios, c-cpp jvm android
        default: c-cpp jvm android
      scenarios:
        description: Names of scenarios, all of the kinds without
        default: ""
      linux:
        description: On Linux
        type: boolean
        default: true
      macos:
        description: Also on macOS
        type: boolean
        default: false

concurrency:
  group: regressions-${{ github.ref }}-${{ inputs.ref || 'main' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BUILD_SCRIPT_REF: ${{ inputs.ref || 'main' }}

jobs:
  linux:
    if: github.event_name == 'push' || inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      # the toolchains of the image the scenarios do not use, the cache needs the space
      - name: Disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/share/boost

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: build-script/build
          ref: ${{ env.BUILD_SCRIPT_REF }}
          path: build-script

      # raylib needs the X11 headers and autotools for its ports, tablegen-colors the LLVM of Homebrew, 23
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev autoconf autoconf-archive automake libtool
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 23 > /dev/null
          sudo apt-get install -q -y llvm-23-dev
          echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"

      # the NDK of jni-android, with the sdkmanager and the licenses of the image
      - name: NDK
        if: contains(inputs.kinds || 'android', 'android')
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            build-script/target
            .home
            .sources
          key: linux-${{ github.run_id }}
          restore-keys: linux-

      - name: build-script
        working-directory: build-script
        run: |
          rustup update stable --no-self-update
          cargo build --release
          cargo test --release

      - name: Scenarios
        run: python3 run.py --build build-script/target/release/build-script --kind ${{ inputs.kinds || 'c-cpp jvm android' }} ${{ inputs.scenarios }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-linux
          path: .logs
          include-hidden-files: true

      # what vcpkg built the ports in stays out, its binary cache is in .home/caches
      - name: Clean up
        if: always()
        run: rm -rf .work .home/vcpkg/*/buildtrees .home/vcpkg/*/packages .home/vcpkg/*/downloads

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            build-script/target
            .home
            .sources
          key: linux-${{ github.run_id }}

  # Java, Kotlin and Android, C and C++ are not set up for Windows yet
  windows:
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      # the logs of the builds have characters that are not in the code page of the console
      PYTHONUTF8: 1
    steps:
      - run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: build-script/build
          ref: ${{ env.BUILD_SCRIPT_REF }}
          path: build-script

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            build-script/target
            .home
            .sources
          key: windows-${{ github.run_id }}
          restore-keys: windows-

      - name: build-script
        working-directory: build-script
        run: |
          rustup update stable --no-self-update
          cargo build --release
          cargo test --release

      - name: Scenarios
        run: python run.py --build build-script/target/release/build-script.exe --kind ${{ inputs.kinds || 'c-cpp jvm android' }} ${{ inputs.scenarios }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-windows
          path: .logs
          include-hidden-files: true

      - name: Clean up
        if: always()
        shell: bash
        run: rm -rf .work

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            build-script/target
            .home
            .sources
          key: windows-${{ github.run_id }}

  macos:
    if: inputs.macos
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: build-script/build
          ref: ${{ env.BUILD_SCRIPT_REF }}
          path: build-script

      - name: Packages
        run: brew install llvm

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            build-script/target
            .home
            .sources
          key: macos-${{ github.run_id }}
          restore-keys: macos-

      - name: build-script
        working-directory: build-script
        run: |
          rustup update stable --no-self-update
          cargo build --release
          cargo test --release

      - name: Scenarios
        run: python3 run.py --build build-script/target/release/build-script --kind ${{ inputs.kinds }} ${{ inputs.scenarios }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-macos
          path: .logs
          include-hidden-files: true

      - name: Clean up
        if: always()
        run: rm -rf .work .home/vcpkg/*/buildtrees .home/vcpkg/*/packages .home/vcpkg/*/downloads

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            build-script/target
            .home
            .sources
          key: macos-${{ github.run_id }}
