# The scenarios against build-script/build: on Linux and Windows all of them, macOS only when asked for,
# its minutes count ten times. The steps that start apps run in a job of their own on an emulator.
name: regressions

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag of build-script/build
        default: main
      kinds:
        description: Kinds of scenarios, c-cpp jvm android
        default: c-cpp jvm android
      scenarios:
        description: Names of scenarios, all of the kinds without
        default: ""
      linux:
        description: On Linux
        type: boolean
        default: true
      macos:
        description: Also on macOS
        type: boolean
        default: false

concurrency:
  group: regressions-${{ github.ref }}-${{ inputs.ref || 'main' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BUILD_SCRIPT_REF: ${{ inputs.ref || 'main' }}

jobs:
  linux:
    if: github.event_name == 'push' || inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      # the toolchains of the image the scenarios do not use, the cache needs the space
      - name: Disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/share/boost

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: build-script/build
          ref: ${{ env.BUILD_SCRIPT_REF }}
          path: build-script

      # raylib needs the X11 headers and autotools for its ports, tablegen-colors the LLVM of Homebrew, 23
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev autoconf autoconf-archive automake libtool
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 23 > /dev/null
          sudo apt-get install -q -y llvm-23-dev
          echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"

      # the NDK of jni-android, with the sdkmanager and the licenses of the image
      - name: NDK
        if: contains(inputs.kinds || 'android', 'android')
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            build-script/target
            .home
            .sources
          key: linux-${{ github.run_id }}
          restore-keys: linux-

      - name: build-script
        working-directory: build-script
        run: |
          rustup update stable --no-self-update
          cargo build --release
          cargo test --release

      - name: Scenarios
        run: python3 run.py --build build-script/target/release/build-script ${{ inputs.scenarios }} --kind ${{ inputs.kinds || 'c-cpp jvm android' }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-linux
          path: .logs
          include-hidden-files: true

      # what vcpkg built the ports in stays out, its binary cache is in .home/caches
      - name: Clean up
        if: always()
        run: rm -rf .work .home/vcpkg/*/buildtrees .home/vcpkg/*/packages .home/vcpkg/*/downloads

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            build-script/target
            .home
            .sources
          key: linux-${{ github.run_id }}

  # the emulator needs the KVM of the Linux machines
  device:
    if: (github.event_name == 'push' || inputs.linux) && contains(inputs.kinds || 'android', 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: build-script/build
          ref: ${{ env.BUILD_SCRIPT_REF }}
          path: build-script

      # it boots while build-script compiles
      - name: Emulator
        run: |
          image="system-images;android-34;google_apis;x86_64"
          # avdmanager takes the home of Java, the emulator HOME: both look here instead
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" emulator "$image" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name regressions --package "$image" --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx regressions
          nohup "$ANDROID_HOME/emulator/emulator" -avd regressions -port 5580 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          echo $! > emulator.pid

      # what the Linux job left the last time, this job saves nothing
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            build-script/target
            .home
            .sources
          key: linux-${{ github.run_id }}
          restore-keys: linux-

      - name: build-script
        working-directory: build-script
        run: |
          rustup update stable --no-self-update
          cargo build --release

      - name: Boot
        timeout-minutes: 10
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          until [ "$("$adb" -s emulator-5580 shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; do
            # an emulator that stopped never boots
            if ! kill -0 "$(cat emulator.pid)" 2> /dev/null; then
              tail -30 emulator.log
              exit 1
            fi
            sleep 2
          done

      - name: Scenarios
        run: python3 run.py --build build-script/target/release/build-script ${{ inputs.scenarios }} --device emulator-5580 --device-only

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-device
          path: |
            .logs
            emulator.log
          include-hidden-files: true

  windows:
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      # the logs of the builds have characters that are not in the code page of the console
      PYTHONUTF8: 1
    steps:
      - run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: build-script/build
          ref: ${{ env.BUILD_SCRIPT_REF }}
          path: build-script

      # the NDK of jni-android, with the sdkmanager and the licenses of the image
      - name: NDK
        if: contains(inputs.kinds || 'android', 'android')
        shell: bash
        run: |
          # yes ends with SIGPIPE once the sdkmanager is done
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "ndk;28.2.13676358" > /dev/null

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            build-script/target
            .home
            .sources
          key: windows-${{ github.run_id }}
          restore-keys: windows-

      - name: build-script
        working-directory: build-script
        run: |
          rustup update stable --no-self-update
          cargo build --release
          cargo test --release

      - name: Scenarios
        run: python run.py --build build-script/target/release/build-script.exe ${{ inputs.scenarios }} --kind ${{ inputs.kinds || 'c-cpp jvm android' }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-windows
          path: .logs
          include-hidden-files: true

      - name: Clean up
        if: always()
        shell: bash
        run: rm -rf .work

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            build-script/target
            .home
            .sources
          key: windows-${{ github.run_id }}

  macos:
    if: inputs.macos
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: build-script/build
          ref: ${{ env.BUILD_SCRIPT_REF }}
          path: build-script

      - name: Packages
        run: brew install llvm

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            build-script/target
            .home
            .sources
          key: macos-${{ github.run_id }}
          restore-keys: macos-

      - name: build-script
        working-directory: build-script
        run: |
          rustup update stable --no-self-update
          cargo build --release
          cargo test --release

      - name: Scenarios
        run: python3 run.py --build build-script/target/release/build-script ${{ inputs.scenarios }} --kind ${{ inputs.kinds }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-macos
          path: .logs
          include-hidden-files: true

      - name: Clean up
        if: always()
        run: rm -rf .work .home/vcpkg/*/buildtrees .home/vcpkg/*/packages .home/vcpkg/*/downloads

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            build-script/target
            .home
            .sources
          key: macos-${{ github.run_id }}
